global:
  scrape_interval: 15s

scrape_configs:
  - job_name: my_backend
    static_configs:
      - targets: ["my_backend:8080"]
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
