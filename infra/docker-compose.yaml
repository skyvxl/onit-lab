name: guestbook-infra

services:
  gitea:
    image: gitea/gitea:1.27
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__repository__DEFAULT_REPO_UNITS: repo.code,repo.issues,repo.pulls,repo.packages,repo.actions
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - gitea_data:/data
    restart: unless-stopped

  runner:
    image: gitea/runner:5.0.0
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: lab-runner
      CONFIG_FILE: /config.yaml
    volumes:
      - ./runner-config.yaml:/config.yaml:ro
      - runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [gitea]
    restart: unless-stopped
    profiles: [ci]

volumes:
  gitea_data:
  runner_data:
