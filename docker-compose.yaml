name: guestbook

services:
  caddy:
    image: ${CADDY_IMAGE:-guestbook-caddy:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.caddy
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    environment:
      RATE_LIMIT_EVENTS: ${RATE_LIMIT_EVENTS:-5}
      LB_POLICY: ${LB_POLICY:-round_robin}
    networks: [frontend]
    depends_on:
      my_backend:
        condition: service_healthy
    restart: unless-stopped

  my_backend:
    image: ${APP_IMAGE:-guestbook:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.main
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: postgresql://${DB_USER:-guestbook}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-guestbook}
    deploy:
      replicas: 3
    networks: [frontend, backend]
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "-T", "2", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: ${MIGRATE_IMAGE:-guestbook-migrate:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgresql://${DB_USER:-guestbook}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-guestbook}
      GOOSE_MIGRATION_DIR: /migrations
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["up"]
    restart: "no"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-guestbook}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-guestbook}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
