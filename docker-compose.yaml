services:
  my_backend:
    build: .
    ports:
      - "8080:8080"

  postgres:
    image: postgres:18
    container_name: postgres18-onit
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: